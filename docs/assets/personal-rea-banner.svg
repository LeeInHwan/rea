<text x="58" y="56" font-size="14" letter-spacing="3" fill="#70e1d4">ARTIFACT TO EVIDENCE</text>
<text x="54" y="125" font-size="57" font-weight="700" fill="#ffffff">Personal REA</text>
<text x="58" y="168" font-size="23" fill="#d5e5f1">배포된 앱에서 근거를 찾고, 복원 결과를 검증합니다.</text>
